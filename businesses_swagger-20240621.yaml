          block of information from the OFAC list where the match occurred
        example: >-
          BANK MELLI IRAN INVESTMENT COMPANY (a.k.a. BMIIC), Rafiee Alley, Nader
          Alley, 2 After Serahi Shahid Beheshti, Vali E Asr Avenue, Tehran,
          Iran; No. 2, Nader Alley, Vali-Asr Str., P.O. Box 3898-15875, Tehran,
          Iran; Bldg 2, Nader Alley after Beheshi Forked Road, P.O. Box
          15875-3898, Tehran 15116, Iran; Business Registration Document # 89584
          (Iran)  NPWMD ;
        maxLength: 1
