                  Total count of derogatory public records including
                  bankruptcies, liens, and judgments
                type: number
                example: 0
              commercialFraudRiskIndicatorCount:
                description: >-
                  Provides count of a number of checks done for indicators of
                  potential fraudulent activity, including OFAC, business
                  activity, business fraud victim indicator, and if there are
                  potential inconsistencies with the business name, address,
                  phone, and Tax ID number.
                type: number
                example: 0
