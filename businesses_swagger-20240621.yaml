  TradePaymentExperiencesResult:
    type: object
    properties:
      paymentIndicator:
        type: object
        description: Indication of how the subject pays the account relative to others within the industry
        properties:
          code:
            type: string
            description: '"-" = Pays slower. "=" = Pays the same. "+" = Pays faster. Blank = No Indicator'
            example: "-"
          definition:
            type: string
            description: Payment Indicator description
            example: "Pays slower"
      businessCategory:
        type: string
        description: Industry of the business
        example: ACCT SERVICES
      dateReported:
        type: string
        description: Date reported to Experian. ISO 8601 Format = YYYY-MM-DD
        example: "2018-01-03"
      dateLastActivity:
        type: string
        description: Last activity date. ISO 8601 Format = YYYY-MM-DD
        example: "2018-01-03"
      terms:
        type: string
        description: 'Payment terms. Example: NET30, NET45, etc.'
        example: "NET30"
      recentHighCredit:
        type: object
        description: Highest account balance in the last 12 months
        properties:
          modifier:
            type: string
            description: >-
              "+" = More than amount reported. "-" = Negative amount. "<" = Less than amount reported. "Null" if Not applicable
            example: null
          amount:
            type: number
            description: Recent high credit amount
            example: 123
      accountBalance:
        type: object
        description: Account balance for all active accounts
        properties:
          modifier:
            type: string
            description: >-
              "+" = More than amount reported. "-" = Negative amount. "<" = Less than amount reported. "Null" if Not applicable
            example: 123
          amount:
            type: number
            description: Account balance
            example: 123
      currentPercentage:
        type: number
        description: >-
          Percentage of the account balance considered current relative to
          payment terms. "999" indicates that the creditor has not supplied
          account aging
        example: 90
      dbt30:
        type: number
        description: >-
          Percentage of the account balance that is beyond terms (late) in the
          1-30 day range
        example: 5
      dbt60:
        type: number
        description: >-
          Percentage of the account balance that is beyond terms (late) in the
          31-60 day range
        example: 3
      dbt90:
        type: number
        description: >-
          Percentage of the account balance that is beyond terms (late) in the
          61-90 day range
        example: 1
      dbt91Plus:
        type: number
        description: >-
          Percentage of the account balance that is beyond terms (late) in the
          91+ day range
        example: 1
      comments:
        type: string
        description: Supplied by the creditor/data contributor
        example: "Account closed"
      tradelineFlag:
        type: object
        description: Flag indicating a special tradeline
        properties:
          code:
            type: string
            description: Tradline Flag code
            example: "Y"
          definition:
            type: string
            description: Tradeline Flag description
            example: "Open Account, No Aging"
      newlyReportedIndicator:
        type: object
        description: >-
          If yes indicates this is a newly reported tradeline that has been
          added in the last 6 months but has not been updated.
        properties:
          code:
            type: string
            description: Code
          definition:
            type: string
            description: Definition
      customerDisputeIndicator:
        type: string
        description: If true the business has disputed information in their profile
        example: "Y"
      itipConsolidatedNumber:
        type: number
        description: Supplied by the creditor/data contributor
        example: 123
  CorporateLinkagePartial:
    description: Each Corporate Linkage Partial Information
    type: object
    properties:
      corporateLinkageType:
        description: >-
          "Ultimate Parent", "Headquarters/Parent", "Subsidiary", or "Branch".
          The Ultimate Parent is the topmost responsible member of the family
          tree. Parent refers to a business with a subsidiary; the immediate
          parent is the parent company for the business that is the subject of
          your request. Subsidiary listings are those which the business in your
          request has at least a 50% ownership stake. Branch refers to
          additional locations or alternate addresses for the business in your
          request.
        type: string
        example: Ultimate Parent
        maxLength: 30
      bin:
        description: >-
          9-digit Business Identification Number (BIN). If this field is blank,
          this business is a non-US business and only the Name, City, and State
          may be available
        type: string
        example: '800914632'
        maxLength: 9
      businessName:
        description: Name of the business
        type: string
        example: EXPERIAN PLC
        maxLength: 120
      address:
        $ref: '#/definitions/LinkageBusinessAddress'
      matchingBusinessIndicator:
        description: If true the linkage business matches the business in your request
        type: boolean
        example: true
        maxLength: 5
      returnLimitExceeded:
        description: >-
          If true additional records are available to request using
          corporateLinkageFull
        type: boolean
        example: true
        maxLength: 5
  CorporateLinkageFull:
    description: Each Corporate Linkage Full Information
    type: object
    properties:
      corporateLinkageType:
        description: >-
          "Ultimate Parent", "Headquarters/Parent", "Subsidiary", or "Branch".
          The Ultimate Parent is the topmost responsible member of the family
          tree. Parent refers to a business with a subsidiary; the immediate
          parent is the parent company for the business that is the subject of
          your request. Subsidiary listings are those which the business in your
          request has at least a 50% ownership stake. Branch refers to
          additional locations or alternate addresses for the business in your
          request.
        type: string
        example: Ultimate Parent
        maxLength: 30
      bin:
        description: >-
          9-digit Business Identification Number (BIN). If this field is blank,
          this business is a non-US business and only the Name, City, and State
          may be available
        type: string
        example: '800914632'
        maxLength: 9
      businessName:
        description: Name of the business
        type: string
        example: EXPERIAN PLC
        maxLength: 120
      address:
        $ref: '#/definitions/LinkageBusinessAddress'
      ultimateBin:
        description: >-
          9-digit Business Identification Number (BIN) for the Ultimate Parent
          of the business
        type: string
        example: '800914632'
        maxLength: 9
      parentBin:
        description: >-
          9-digit Business Identification Number (BIN) for the immediate Parent
          of the business
        type: string
        example: '800914632'
        maxLength: 9
      ultimateParentIndicator:
        description: If true this business is the Ultimate Parent
        type: boolean
        example: true
        maxLength: 5
      parentIndicator:
        description: If true this business is the Parent of another business
        type: boolean
        example: true
        maxLength: 5
      subsidiaryIndicator:
        description: If true this business is a subsidiary of another business
        type: boolean
        example: true
        maxLength: 5
      linkageLevel:
        description: >-
          Indicates how many parent companies are above the business in the
          family tree. For example, an Ultimate Parent will return linkageLevel
          = 0. An Ultimate Parent's immediate subsidiaries will return
          linkageLevel = 1
        type: integer
        format: int64
        example: 1
        maxLength: 2
      branchIndicator:
        description: >-
          If true this indicates that branches were returned in the family tree.
          If false branches were not returned since the number of records in the
          full family tree exceeded 300. Only returned for an Ultimate Parent
          record, when linkageLevel = 0
        type: boolean
        example: true
        maxLength: 5
      activityIndicator:
        description: >-
          If false the business may be inactive. To determine active status,
          Experian looks at bankruptcies, corporate registrations, trades,
          collections, and recent credit inquiry activity
        type: boolean
        example: true
        maxLength: 5
      commercialRiskClass:
        description: >-
          Commercial score risk class default values: "High Risk", "Medium to
          High Risk", "Medium Risk", "Low to Medium Risk", "Low Risk", "Recent
          Bankruptcy on file", "Insufficient data to score"
        type: string
        example: High Risk
        maxLength: 20
