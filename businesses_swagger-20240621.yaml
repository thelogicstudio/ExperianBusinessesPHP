  scoreInformation:
    type: object
    properties:
      fsrScore:
        type: object
        description: JSON object containing scoring information for the Financial Stability Risk (FSR) score
        properties:
          publiclyHeldCompany:
            type: boolean
            description: If true indicates the business is a publicly held company
          limitedProfile:
            type: boolean
            description: If true indicates a limited profile
          score:
            type: number
            description: >-
              FSR score predicts the likelihood of severe delinquency or bankruptcy within the next 12 months.
          profileNumber:
            type: string
            description: Profile number
          modelCode:
            type: string
            description: FSR score model code
          modelTitle:
            type: string
            description: FSR score model title
          percentileRanking:
            type: number
            description: >-
              Percentage of businesses that would score lower than this business.
              998 displays when there is a recent bankruptcy;
              999 displays when there is insufficient data to score
          probability:
            type: number
            description: Probability percentage that the business will go bad
          riskClass:
            type: object
            description: FSR score risk class
            properties:
              code:
                type: number
                description: >-
                  1 = "Low Risk", 2 = "Low to Medium Risk", 3 = "Medium Risk",
                  4 = "Medium to High Risk", 5 = "High Risk",
                  998 = "Recent bankruptcy on file", 999 = "Insufficient data to score"
              definition:
                type: string
                description: >-
                  FSR score risk class default values "High Risk",
                  "Medium to High Risk", "Medium Risk", "Low to Medium Risk", "Low Risk",
                  "Recent Bankruptcy on file", "Insufficient data to score"
          customerDisputeIndicator:
            type: boolean
            description: If true, indicates that there is a customer dispute on file
      commercialScore:
        type: object
        description: JSON object containing scoring information for the commercial model used
        properties:
          publiclyHeldCompany:
            type: boolean
            description: If true indicates the business is a publicly held company
          limitedProfile:
            type: boolean
            description: If true indicates the profile response is limited and therefore not scored
          score:
            type: number
            description: >-
              Commercial score predicts the likelihood that a business will pay in seriously
              delinquent manner (91+ days) in the next 12 months. 998 displays when a bankruptcy is present in
              the last 2 years. 999 displays when there is not enough information on
              file to score the business
          profileNumber:
            type: string
            description: Number required to request a supporting Business Profile
          modelCode:
            type: string
            description: Commercial score model code. Default model code 000254, Intelliscore Plus v3 Machine Learning
          modelTitle:
            type: string
            description: Commercial score model title. Default model code 000254, Intelliscore Plus v3 Machine Learning
          percentileRanking:
            type: number
            description: >-
              "Percentage of businesses that would score lower than this business.
              998 displays when there is a recent bankruptcy;
              999 displays when there is insufficient data to score"
          probability:
            type: number
            description: Probability percentage that the business will go bad
          riskClass:
            type: object
            description: Commercial score risk class
            properties:
              code:
                type: number
                description: >-
                  1 = "Low Risk", 2 = "Low to Medium Risk", 3 = "Medium Risk",
                  4 = "Medium to High Risk", 5 = "High Risk", 998 = "Recent bankruptcy on file",
                  999 = "Insufficient data to score"
              definition:
                type: string
                description: >-
                  Commercial score risk class default values "High Risk",
                  "Medium to High Risk", "Medium Risk", "Low to Medium Risk",
                  "Low Risk", "Recent Bankruptcy on file", "Insufficient data to score",
          customerDisputeIndicator:
            type: boolean
            description: If true indicates that a customer dispute is on file
          customModelCode:
            type: string
            description: Only returned if you are using a custom model
          recommendedCreditLimitAmount:
            type: number
            description: >-
              Compares the business against similar businesses. The credit line is based on trade
              information, industry, age of business and the Intelliscore Plus score. A proprietary
              calculation using these data elements generates the credit line recommendation for a business
          highCreditLimitAmount:
            type: number
            description: Highest account balance the business has carried
      fsrScoreFactors:
        type: array
        description: Indicates the factors most influential in lowering the FSR score
        items:
          $ref: '#/definitions/scoreFactors'
      commercialScoreFactors:
        type: array
        description: Indicates the factors most influential in lowering the commercial score
        items:
          $ref: '#/definitions/scoreFactors'
      fsrScoreTrends:
        type: array
        description: JSON array of objects containing the four most recent quarters of FSR score information
        items:
          $ref: '#/definitions/scoreTrends'
      commercialScoreTrends:
        type: array
        description: JSON array of object containing the four most recent quarters of commercial score information
        items:
          $ref: '#/definitions/scoreTrends'
