          tree. Parent refers to a business with a subsidiary; the immediate
          parent is the parent company for the business that is the subject of
          your request. Subsidiary listings are those which the business in your
          request has at least a 50% ownership stake. Branch refers to
          additional locations or alternate addresses for the business in your
          request.
        type: string
        example: Ultimate Parent
      matchingBusinessIndicator:
