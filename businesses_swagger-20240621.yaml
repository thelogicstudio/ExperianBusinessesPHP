  /v1/headers:
    post:
      operationId: headers
      summary: Business Headers
      tags:
        - Business Information Services
      security:
        - OauthSecurity:
            - admin
      consumes:
        - application/json
      description: >-
        <p>The Business Headers API is both an individual API, and also a data
        segment returned with many of Experian's credit and public record APIs.
        The business header contains critical business identity information such
        as Experian's best business name on file, the full verified legal name
        and DBA names of the business, the business address, phone number,
        business Tax Identification number or Employer Identification Number
        (EIN), and the businesses website URL.</p>
      parameters:
        - description: Business Headers Request
          in: body
          required: true
          name: body
          schema:
            $ref: '#/definitions/BusinessDataRequest'
        - name: Content-Type
          in: header
          default: application/json
          enum:
            - application/json
          description: Content-Type field is to describe the data contained in the body
          required: true
          type: string
        - name: x-comments
          in: header 
          default: Test comment
          description: An echo back field that will return x-comments in the response header 
          required: false
          type: string    
      produces:
        - application/json
      responses:
        '200':
          description: Business Headers Results
          schema:
            $ref: '#/definitions/BusinessHeaderResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse400'
        '401':
          description: Authorization information is missing or invalid
          schema:
            $ref: '#/definitions/ErrorResponse401'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse404'
        '500':
          description: Subscription Error
          schema:
            $ref: '#/definitions/ErrorResponse500'
        '502':
          description: Server Error
          schema:
            $ref: '#/definitions/ErrorResponse502'
        '503':
