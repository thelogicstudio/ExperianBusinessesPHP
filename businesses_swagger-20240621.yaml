  /v1/cyberscore:
    post:
      operationId: cyberscore
      summary: Cyber Risk Score and Attributes
      tags:
        - Business Information Services
      security:
        - OauthSecurity:
            - admin
      consumes:
        - application/json
      description: >-
        <p>Experian’s Cyber Risk Score predicts the likelihood of a cyber-attack within the next 
        12 months by calculating each employee’s cyber risk exposure.  The model utilizes multiple 
        Experian datasets and proprietary linkage capabilities to create a digital identity for 
        employees, identify cyber risky behaviors, link employees to companies, and determine an 
        aggregate risk score for the business.</p>
        <ul>
        <li>Cyber Score Model Code = 268</li>
        <li>Cyber Score Model Test Subcode = 0563736</li>
        </ul>
        <p><br /></p>
        <ul>
        <li><strong>"subcode"</strong> – required</li>
        <li><strong>"bin"</strong> - required</li>
        <li><strong>"comments"</strong> – optional.</li>
        <li><strong>"cyberRiskScore"</strong> – Boolean. If true, receive the Cyber Risk Score</li>
        <li><strong>"scoreAttributes"</strong> – Boolean. If true, receive the Cyber Risk Attributes.  Set both the 
        "cyberRiskScore" and "cyberRiskAttributes" to true to receive both.</li>
        </ul>
      parameters:
        - description: Cyber Score Request
          in: body
          required: true
          name: body
          schema:
            $ref: '#/definitions/CyberScoreRequest'
        - name: Content-Type
          in: header
          default: application/json
          enum:
            - application/json
          description: Content-Type field is to describe the data contained in the body
          required: true
          type: string
        - name: x-comments
          in: header 
          default: Test comment
          description: An echo back field that will return x-comments in the response header 
          required: false
          type: string    
      produces:
        - application/json
      responses:
        '200':
          description: Cyber Score Results
          schema:
            $ref: '#/definitions/CyberScoreResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse400'
        '401':
          description: Authorization information is missing or invalid
          schema:
            $ref: '#/definitions/ErrorResponse401'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse404'
        '500':
          description: Subscription Error
          schema:
            $ref: '#/definitions/ErrorResponse500'
        '502':
          description: Server Error
          schema:
            $ref: '#/definitions/ErrorResponse502'
        '503':
          description: Server Error
          schema:
            $ref: '#/definitions/ErrorResponse503'
definitions:
  GovernmentDetailsRequest:
    required:
      - subcode
      - bin
    type: object
    properties:
      subcode:
        default: '0586548'
        description: Your Experian account subcode for billing purposes (required)
        type: string
        example: '0586548'
      bin:
        default: '712512408'
        description: 9-digit Business Identification Number (BIN)
        type: string
        example: '712512408'
      comments:
        default: 'test123'
        description: >-
          Optionally, you can send a comment along with your request;  and
          the comment will be returned with your response.  Useful for your
          internal ID tracking
        type: string
        example: abcde12345
  GovernmentDetailsResponse:
    allOf:
      - $ref: '#/definitions/BusinessDataResponse'
      - type: object
        properties:
          results:
            $ref: '#/definitions/GovernmentDetailsResult'
  GovernmentDetailsResult:
    type: object
    description: Government Details Result
    properties:
      commercialGovernmentEntityCode:
        description: "CAGE Code"
        type: object
        properties:
          cageCode:
            description: "Commercial and Government Entity Code"
            type: string
            example: "A"
            maxLength: 1
          samNumber:
            description: "Service for Award Management Number assigned by the\
              \ government to suppliers"
            type: string
            example: "100"
            maxLength: 30
      economicDiversity:
        description: "Highlights details regarding whether the business is certified\
          \ for participation in programs seeking to increase economic diversity\
          \ in contracting"
        type: object
        properties:
          mbe:
            description: "Minority-Owned Business Enterprise"
            type: boolean
            example: true
            maxLength: 5
          wbe:
            description: "Woman-Owned Business Enterprise"
            type: boolean
            example: true
            maxLength: 5
          dbe:
            description: "Disadvantaged Business Enterprise"
            type: boolean
            example: true
            maxLength: 5
          sba8a:
            description: "Participant in SBA 8A program"
            type: boolean
            example: true
            maxLength: 5
          hubzone:
            description: "Historically Underutilized Business"
            type: boolean
            example: true
            maxLength: 5
          vet:
            description: "Veteran-Owned Business Enterprise"
            type: boolean
            example: true
            maxLength: 5
          dvet:
            description: "Service Disabled Veteran-Owned Business Enterprise"
            type: boolean
            example: true
            maxLength: 5
          hbcu:
            description: "Historical Black Colleges and Universities. Institutions\
              \ of higher education in the United States that were established\
              \ before 1964 with the intention of serving the black community"
            type: boolean
            example: true
            maxLength: 5
          sdb:
            description: "Small Disadvantage Business Enterprise"
            type: boolean
            example: true
            maxLength: 5
          sba:
            description: "Small Business Administration Enterprise"
            type: boolean
            example: true
            maxLength: 5
          lsa:
            description: "Labor Surplus Area"
            type: boolean
            example: true
            maxLength: 5
      governmentActivity:
        description: "Details the business’s activities with respect to federal\
          \ contracting programs. This information may be helpful in determining\
          \ if the business may have participated in federal contracts in the\
          \ past or if it is currently debarred from doing business with the federal\
          \ government"
        type: object
        properties:
          congressionalDistrict:
            description: "The Congressional District wherein the business is located\
              \ (within the state)"
            type: string
            example: "Sample String Value"
            maxLength: 30
          contractorIndicator:
            description: "If true, indicates the business is registered with Central\
              \ Contractor Registration (CCR)"
            type: boolean
            example: true
            maxLength: 5
          debarredIndicator:
            description: "If true, indicates that the business is excluded from\
              \ receiving Federal contracts, certain subcontracts, and certain\
              \ types of Federal financial and non-financial assistance and benefits"
            type: boolean
            example: true
            maxLength: 5
          agency:
            description: "Government agency that took the exclusion action"
            type: object
            properties:
              code:
                description: "Code"
                type: string
                example: "NAVY"
                maxLength: 20
              definition:
                description: "Definition"
                type: string
                example: DEPARTMENT OF NAVY
                maxLength: 30
          exclusionType:
            description: "Type of Exclusions: Preliminarily Ineligible (Proceedings\
              \ Pending), Ineligible (Proceedings Completed), Prohibition/Restriction,\
              \ Voluntary Exclusion, or Null if not available"
            type: string
            example: "Sample String Value"
            maxLength: 30
          activeDate:
            description: "The date that the exclusion became active, when the\
              \ entity is no longer able to do business with the Federal Government.\
              \ Format YYYY-MM-DD"
            type: string
            example: "2018-01-20"
            maxLength: 10
          terminationDate:
            description: "The date that the exclusion will be removed from the\
              \ current list of active exclusions and placed in the inactive list.\
              \ Format YYYY-MM-DD"
            type: string
            example: "2018-01-20"
            maxLength: 10
          importExportCode:
            description: "Identifies if a business is an Importer, Exporter, or\
              \ Both. Future Field"
            type: string
            example: "A"
            maxLength: 2
      contractSpendingSummary:
        description: "Summary of US Government Contract Spending awarded to the\
          \ business"
        type: object
        properties:
          totalDollarAmount:
            description: "Total dollar amount"
            type: number
            example: 100
            maxLength: 1
          totalNumberOfTransactions:
            description: "Total number of transactions"
            type: number
            example: 100
            maxLength: 1
          currentFiscalYear:
            description: "Current fiscal year"
            type: object
            properties:
              year:
                description: "Current fiscal year"
                type: number
                example: 100
                maxLength: 1
              totalAmount:
                description: "Current fiscal year total dollar amount"
                type: number
                example: 100
                maxLength: 1
              singleHighestAmount:
                description: "Current fiscal year single highest dollar amount"
                type: number
                example: 100
                maxLength: 1
          priorFiscalYear:
            type: array
            description: "Prior fiscal year, occurs up to 4 times"
            items:
              type: object
              properties:
                year:
                  description: "Prior fiscal year"
                  type: number
                  example: 100
                  maxLength: 1
                totalAmount:
                  description: "Prior fiscal year total dollar amount"
                  type: number
                  example: 100
                  maxLength: 1
                singleHighestAmount:
                  description: "Prior fiscal year single highest dollar amount"
                  type: number
                  example: 100
                  maxLength: 1
      contractSpendingDetail:
        type: array
        description: "Provides up to five years of prime contract transaction
          data for federal agencies making contract, grant, loan, and other
          financial assistance awards"
        items:
          type: object
          properties:
            contractAction:
              description: "Contract Action description"
              type: string
              example: "Sample String Value"
              maxLength: 1
            programSource:
              description: "Program Source description. Null if not reported"
              type: string
              example: "Sample String Value"
              maxLength: 1
            departmentAgency:
              description: "Department Agency description. Null if not reported"
              type: string
              example: "Sample String Value"
              maxLength: 1
            productService:
              description: "Product Service description. Null if not reported"
              type: string
              example: "Sample String Value"
              maxLength: 1
            signedDate:
              description: "Date contract was signed. Format YYYY-MM-DD"
              type: string
              example: "2018-01-20"
              maxLength: 10
            obligationAmount:
              description: "Dollar amount of obligation"
              type: number
              example: 100
              maxLength: 1
            reasonForModification:
              description: "Reason for modification"
              type: string
              example: "Sample String Value"
              maxLength: 1
            sequenceNumber:
              description: "This field shall be assigned a number (01-05) depending\
                \ on which contractSpendingDetail segment has been generated.\
                \ This value shall be used to match the appropriate contractAdditionalDescription\
                \ segment to its appropriate 5620 segment"
              type: number
              example: 100
              maxLength: 1
      contractAdditionalDescription:
        type: array
        description: Contract Additional Description
        items:
          type: object
          properties:
            descriptionText:
              description: Text
              type: string
              example: "Sample String Value"
              maxLength: 1
            sequenceNumber:
              description: Sequence Number
              type: number
              example: 100
              maxLength: 1
            additionalDescriptionIndicator:
              description: Additional Description Indicator
              type: boolean
              example: true
              maxLength: 5
  MultiSegmentsRequest:
    required:
      - subcode
      - bin
    type: object
    properties:
      subcode:
        default: '0563736'
        description: Your Experian account subcode for billing purposes (required)
        type: string
        example: '0563736'
        maxLength: 7
      bin:
        default: '700000001'
        description: 9-digit Business Identification Number (BIN)
        type: string
        example: '700000001'
        maxLength: 9
      street:
        type: string
        description: Agent street
        example: 100 Broadway
        maxLength: 255
      city:
        type: string
        description: Agent city
        example: New York
        maxLength: 50
      state:
        type: string
        description: Agent state
        example: NY
        maxLength: 2
      zip:
        type: string
        description: Agent zip
        example: '10005'
        maxLength: 9
      phone:
        default: '9495673800'
        description: 10-digit phone number
        type: string
        example: '1234567899'
        maxLength: 10
      taxId:
        default: '123456789'
        description: 9-digit federal tax ID or Employer Identification Number
        type: string
        example: '176970333'  
        maxLength: 9
      comments:
        default: 'test12345'
        description: >-
          Optionally, you can send a comment along with your request;  and
          the comment will be returned with your response.  Useful for your
          internal ID tracking
        type: string
        example: abcde12345
        maxLength: 30
      dataPoints:
        description: Array containing parameters for commit orders
        type: array
        items:
          type: string
        example: [bankruptcyDetail, bankruptcySummary, collectionsDetail, collectionsSummary, 
         businessContacts, corporateLinkageFull, corporateLinkagePartial, corporateRegistration, 
         creditStatus, businessFacts, fraudShield, istWatch, header, judgmentDetail, judgmentSummary, 
         legalFilingsCollectionsSummary, legalFilingsSummary, lienDetail, lienSummary, reverseAddress, 
         reversePhone, reverseTaxId, riskDashboard, commercialScore, fsrScore, tradePaymentSummary, 
         tradePaymentTotals, tradePaymentTrends, tradePaymentExperiences, uccFilingsDetail, uccFilingsSummary, istWatch]
        default: [bankruptcyDetail, bankruptcySummary, collectionsDetail, collectionsSummary, 
         businessContacts, corporateLinkageFull, corporateLinkagePartial, corporateRegistration, 
         creditStatus, businessFacts, fraudShield, istWatch, header, judgmentDetail, judgmentSummary, 
