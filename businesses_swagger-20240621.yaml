        description: If true, the Business establishment is self-certified as veteran-owned according to the US Small Business Administration
      disabledVeteranOwnedIndicator:
        type: boolean
        description: If true, the Business establishment is self-certified according to the US Small Business Administration as service-disabled veteran-owned
      historicalBlackCollegeAndUniversitiesIndicator:
        type: boolean
        description: If true, the Entity is certified by the US Department of Education as an accredited historically black college or university, established prior to 1964, with the principal mission of educating black Americans
  corporateFinancialInformation:
    type: object
    properties:
      currentDate:
        type: string
        description: Date the financial statement data is current through.
        example: "JAN 31"
      fiscalYearEndDate:
        type: string
        description: Date the financial statement data is current through. Format = YYYY-MM-DD
      balanceSheets:
        type: array
        description: >-
          A balance sheet is a company's statement of assets, liabilities and net worth.
          Information is included for up to three fiscal years.
          You can analyze the current statement or conduct up to a three-year
          trend analysis of key financial items
        items:
          type: object
          properties:
            yearEnd:
              type: number
              description: Year end of the financial statement item
            cashAndEquivalent:
              type: number
              description: Total amount of cash and equivalent liquid assets
            receivablesNet:
              type: number
              description: Total amount of net receivables
            inventory:
              type: number
              description: Total amount of inventory
            otherCurrentAssets:
              type: number
              description: Total of other current assets that are likely to be converted into cash in the next 12 months
            totalCurrentAssets:
              type: number
              description: Total amount of all current assets
            fixedAssets:
              type: number
              description: Total amount of all fixed assets, such as plant, property, and equipment
            investments:
              type: number
              description: Total amount of assets classified as investments
            otherAssets:
              type: number
              description: Total amount of other non-current assets that are not expected to be converted to cash in the next 12 months
            totalAssets:
              type: number
              description: The total amount of all assets
            debtDueIn1Year:
              type: number
              description: Total amount of current liabilities, or debts the company owes that are expected to be paid in the next 12 months
            notesPayable:
              type: number
              description: Total amount of notes payable
            accountsPayable:
              type: number
              description: Total amount of accounts payable
            taxesPayable:
              type: number
              description: Total amount of taxes payable
            otherCurrentLiabilities:
              type: number
              description: Total amount of other current liabilities
            totalCurrentLiabilities:
              type: number
              description: Total amount of all current liabilities
            longTermDebt:
              type: number
              description: Total long term debt that is due beyond the next 12 months, such as bank loans
            otherLiabilities:
              type: number
              description: Total other liabilities
            netWorth:
              type: number
              description: Net worth is calculated by subtracting the company's total liabilities from its total assets
            totalLiabilitiesandNetWorth:
              type: number
              description: The sum of total liabilities and net worth. Will equal total assets
      operatingStatements:
        type: array
        description: >-
          Operating statement, also known as a profit and loss statement or income statement,
          provides details of a company's sales, cost of sales, operating expenses and net profit/loss
        items:
          type: object
          properties:
            yearEnd:
              type: number
              description: Year end of the financial statement item
            netSales:
              type: number
              description: The amount of sales recorded after the deduction of returns, allowances, and discounts
            costOfGoodsSold:
              type: number
              description: Total amount of cost of goods sold, which are the direct costs attributable to the production of goods sold by the company
            grossIncomeOnSales:
              type: number
              description: Total amount of gross income, which is Net Sales minus Cost of Goods Sold (COGS)
            expenses:
              type: number
              description: Total amount of expenses
            preTaxIncome:
              type: number
              description: Total amount of pre-tax income
            taxes:
              type: number
              description: Total taxes
            afterTaxes:
              type: number
              description: Total after taxes
            extraordinaryIncome:
              type: number
              description: Total amount of extraordinary income
            netIncome:
              type: number
              description: Net income
      criticalDataAndFinancialRatios:
        type: array
        description: >-
          Financial ratios help to understand the liquidity and
          solvency of the business
        items:
          type: object
          properties:
            yearEnd:
              type: number
              description: Year end of the financial statement item
            tangibleNetWorth:
              type: number
              description: Total tangible assets minus total liabilities
            netWorkingCapital:
              type: number
              description: Current assets minus current liabilities. Indicates if the company has enough short term assets to cover short term debt
            currentRatio:
              type: number
              description: The ratio of current assets to current liabilities. Helps to understand how much cash a company has or can expect to generate from selling inventory in relation to its obligations that are expected to be paid over the next 12 months
            totalDebttoTangibleNetWorth:
              type: number
              description: The ratio of total debt to total tangible net worth. Indicates an approximate liquidation value of the company
            currentDebtToTangibleNetWorth:
              type: number
              description: The ratio of current liabilities to tangible net worth
            afterTaxIncomeToTangibleNetWorth:
              type: number
              description: The ratio of after tax income to tangible net worth
            afterTaxIncomeToNetSales:
              type: number
              description: The raio of after tax income to net sales
            netSalestoInventory:
              type: number
              description: Inventory turnover, the ratio of net sales to average inventory
            costOfGoodsSoldToInventory:
              type: number
              description: Inventory turnover, the ratio of COGS to inventory
            averageDaysSalesOutstanding:
              type: number
              description: Average days sales outstanding, or DSO, measures a company's average collection period, or how well they manage their accounts receivables
  consumerStatement:
