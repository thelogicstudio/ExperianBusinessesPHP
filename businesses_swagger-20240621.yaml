  /v1/multisegments:
    post:
      operationId: multisegments
      summary: MultiSegments. Request a la carte segments in a single call
      tags:
        - Business Information Services
      security:
        - OauthSecurity:
            - admin
      consumes:
        - application/json
      description: >-
        <p>The MultiSegments API allows you to call the data segments available in most of the endpoints in the Businesses API in a single API call,
        simplifying your development process and potentially improving your API response time experience.</p>
        <BR><p>The list of segments that can be called from the MultiSegments API are:</p>
        <p>bankruptcyDetail, bankruptcySummary, collectionsDetail, collectionsSummary, businessContacts,
        corporateLinkageFull, corporateLinkagePartial, corporateRegistration, creditStatus, businessFacts,
        fraudShield, istWatch, header, judgmentDetail, judgmentSummary, legalFilingsCollectionsSummary, legalFilingsSummary,
        lienDetail, lienSummary, reverseAddress, reversePhone, reverseTaxId, riskDashboard, commercialScore,
        fsrScore, tradePaymentSummary, tradePaymentTotals, tradePaymentTrends, tradePaymentExperiences,
        uccFilingsDetail, uccFilingsSummary</p>
        <p>Sample subcodes for Intelliscore Plus version 3</p>
