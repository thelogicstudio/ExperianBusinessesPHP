        example: '2017-07-15'
        maxLength: 12
      recentFilingDate:
        type: string
        description: >-
          Date of the most recent corporate registration filing. Format =
          YYYY-MM-DD. Null if not available
        example: '2017-07-15'
        maxLength: 12
      incorporatedDate:
        type: string
        description: >-
          Date the business incorporated in the state. Format = YYYY-MM-DD. Null
          if not available
        example: '1973-01-20'
        maxLength: 12
      businessType:
        type: string
        description: 'Business type, such as LLC, Corporation, etc. Null if not available'
        example: LLC
        maxLength: 15
      statusFlag:
        type: string
        description: A = Active. I = Inactive. Null if not available
        example: A
        maxLength: 10
      statusDescription:
        type: string
        description: >-
          Active businesses are classified as either "Good standing" or
          "Reinstated". A description for inactive businesses is also provided;
          "Bankruptcy", "Terminated", "Revoked", etc.
        example: Good standing
        maxLength: 50
      profitFlag:
