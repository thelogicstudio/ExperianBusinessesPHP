  OFACMatchWarning:
    type: object
    description: >-
      Provides indication if the business name or address may contain possible
      matching to the Office of Foreign Assets Control (OFAC) list. Possible
      values include Code 1 = "No OFAC match found", Code 11 = "OFAC match to
      company name only", Code 12 = "OFAC match to business address only", Code
      13 = "OFAC match to company name and address", Code null = "No OFAC match
      attempt made"
    properties:
      code:
