        consumer linkage for contacts affiliated with the business. The  API
        will identify any known business owners/principals of the  business,
        including both individual owners and company owners, as  well as the
        known contact titles of those individuals at the business.   Lastly, the
        API also returns a list of other businesses those contacts  are
        affiliated with.  The Business Contacts API is useful in identifying
        potentially undisclosed beneficial owners, as well as providing
        business  affiliations and contact affiliations to support fraud,
        regulatory,  or compliance investigations.</p>
