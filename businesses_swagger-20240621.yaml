swagger: '2.0'
host: sandbox-us-api.experian.com
basePath: /businessinformation/businesses
schemes:
  - https
securityDefinitions:
  OauthSecurity:
    type: oauth2

    flow: password
    tokenUrl: 'https://sandbox-us-api.experian.com/oauth2/v1/token'
    scopes:
      admin: admin scope
info:
  description: >-
    <p>Experian's Business Information Services is a leader in providing data
    and predictive insights to organizations, helping them mitigate risk and
    improve profitability.  The Businesses API provides integrated access to our
    business database which provides comprehensive, third-party-verified
    information on 99.9 percent of all U.S. companies, with the industry's most
    extensive data on the broad spectrum of small and midsize businesses.</p>
    <p>&nbsp;</p>
    <p>The Businesses API provides a la carte access to Experian's commercial
    credit and  commercial public record information, including commercial
    scores, trades, corporate linkage, bankruptcies, liens, judgments, and
    more.</p>
    <p>&nbsp;</p>
    <p><strong>It All Starts With a Search</strong></p>
    <p>The Business Search API allows you to input a business name, address, city, and
    state to find their Business Identification Number (BIN) - you'll need this
    to get data from most of the other APIs.  The primary search method is called "Advanced Search" and can be used for automated matching using our Match Reliability Code.  
    A secondary search method, called "QuickSearch" and is a type-ahead style search that allows a human user to quickly find a business using a smaller amount of data.</p>
    <p><strong>SBCS Consortium Members</strong> can use the Businesses API search endpoints.</p>
    <p><strong>SBFE Consortium Members</strong> must use the <a href="/products/us/small-business-financial-exchangetm">SBFE API</a>, using either the 
    List of Similars product option to search for a business, or a Name/Address request for automated matching.</p> 
    <p>&nbsp;</p>
    <p><strong>Businesses API in the Sandbox</strong></p>
    <ul>
    <li><strong>Advanced Search</strong> - The primary way to search for US businesses and return a List of Similars. Designed for both automation and human interaction</li>
    <li><strong>Quick Search</strong> - The secondary search method. A flexible, type-ahead style search API for US businesses. Designed primarily for human interaction</li>
    <li><strong>Headers</strong> - Business identity information. Available as stand-alone and included with most API responses</li>
    <li><strong>Scores</strong> - Commercial Intelliscore Plus and Financial Stability Risk Scores, with scores, score factors, and monthly and quarterly trends</li>
    <li><strong>Scores Auto Search</strong> - Returns the Scores API, but with a Business Name and Address request input</li>
    <li><strong>Premier Profiles JSON</strong> - Experian's flagship commercial credit report</li>
    <li><strong>Premier Profiles HTML</strong> - Renders a styled Premier Profile report using HTML/CSS</li>
    <li><strong>Premier Profiles PDF</strong> - Provides an encoded Premier Profile PDF report</li>
    <li><strong>Intelliscore Report JSON</strong> – Our score only report</li>
    <li><strong>Intelliscore Report HTML</strong> – Our score only report in HTML format</li>
    <li><strong>Intelliscore Report PDF</strong> – Our score only report in PDF format</li>
    <li><strong>Business Compliance Insight JSON</strong> – The BCI report helps with client onboarding and Know-Your-Customer investigations</li>
    <li><strong>Business Compliance Insight HTML</strong> – The BCI Report in HTML format</li>
    <li><strong>Business Compliance Insight PDF</strong> – The BCI report in PDF format</li>
    <li><strong>Aggregates</strong> - The BizAggs represent over 400 unique data attributes that represent the building blocks of commercial credit</li>
    <li><strong>MultiSegments</strong> - MultiSegments allows you to request segments from most Businesses API endpoints in a single API call</li>
    <li><strong>Risk Dashboards</strong> - Includes commercial and FSR scores, credit limit amount, current DBT</li>
    <li><strong>Business Facts</strong> - Key operational facts including SIC, NAICS, public status, sales, employees</li>
    <li><strong>Fraud Shields</strong> - Screens for potential indicators of fraud. Includes possible OFAC match</li>
    <li><strong>Credit Status</strong> - Key credit facts about the business including tradeline count, balance, DBT</li>
    <li><strong>Legal Filings and Collections Summaries</strong> - Summary of all legal filings and collections</li>
    <li><strong>Collections</strong> - Summary and Detail</li>
    <li><strong>Trades</strong> - Trade summary, payment experiences, payment totals, and trade payment trends</li>
    <li><strong>Bankruptcies</strong> - Summary and Detail</li>
    <li><strong>Liens</strong> - Summary and Detail</li>
    <li><strong>Judgments</strong> - Summary and Detail</li>
    <li><strong>UCC Filings</strong> - Summary and Trends</li>
    <li><strong>Corporate Registrations</strong> - Corporate registration info for the business, including filing status</li>
    <li><strong>Corporate Linkage</strong> - Partial and/or Full Family Tree</li>
    <li><strong>Business Contacts</strong> - Individual owners, company owners, contacts and titles, and contacts business affiliations</li>
    <li><strong>Reverse Addresses</strong> - Input an address and find businesses affiliated with that address</li>
    <li><strong>Reverse Phones</strong> - Input a phone number and find businesses affiliated with that phone number</li>
    <li><strong>Reverse Tax IDs</strong> - Input a Tax ID (EIN) and find businesses affiliated with that Tax ID</li>
    <li><strong>Government Details</strong> – Economic diversity and government contract data for the business</li>
    <li><strong>IST Watch</strong> - Manage OFAC regulatory compliance and watchlist screening with the IST Watch API</li>
    <li><strong>Cyber Risk Score and Attributes</strong> – Identifies employee cyber risk behaviors that indicate risk for a business</li>
    </ul>
    <p>&nbsp;</p>
    <p><strong>Businesses API Environments</strong></p>
    <ul>
    <li><strong>Sandbox </strong> - https://sandbox-us-api.experian.com/businessinformation/businesses</li>
    <li><strong>UAT </strong> - https://uat-us-api.experian.com/businessinformation/businesses</li>
    <li><strong>Production</strong> - https://us-api.experian.com/businessinformation/businesses</li>
    </ul>
    <p>&nbsp;</p>
    <p>Please note that the Businesses API in the Developer Portal Sandbox is a non-production service that is for testing and
    demonstration purposes only. Only a limited number of businesses are
    available in the sandbox test environment. A list of valid Business
    Identification Numbers  (BINs) can be provided to you upon your request, and
    valid BINs in the sandbox can  also be obtained using the Business Search
    API. Please contact your Experian Account Executive to discuss obtaining
    production access to the Businesses API.</p>
    <p>&nbsp;</p>
    <p><strong>IPv3 Sample Subcodes</strong></p>
    <ul>
    <li>IPv3 Logistic Regression - 0586286</li>
    <li>IPv3 Machine Learning - 0586548</li>
    </ul>
    <p>&nbsp;</p>
    <p><strong>Additional Developer Tools</strong></p>
    <ul>
    <li><a href="https://github.com/experianplc/Experian-BIS-Postman-Collection"><strong>BIS API Postman Collection</strong></a> - A starter Postman Collection and Environment for many BIS APIs</li>
    <li><a href="https://github.com/experianplc/BIS-HTML-Resources"><strong>BIS HTML Resources</strong></a> - Images, CSS, and Javsscript files necessary to render BIS HTML API reports</li>
    </ul>
  title: Businesses
  version: 1.0.3
paths:
  /v1/search:
    post:
      operationId: search
      summary: Advanced Business Search.  The primary search method
      tags:
        - Business Information Services
      security:
        - OauthSecurity:
            - admin
      consumes:
        - application/json
      description: >-
        <p>The Business Search API allows you to leverage Experian's powerful
        search match technology to find information on a business.  The Search
        API presents a list of business to the business you are searching for,
        ranked by match reliability code.  Each business returned in the list
        will include the legal name, address, and phone number of the business
        Experian has on file, and optionally business geocode data.
        Additionally, several depth indicators show the businesses trade line
        activity and the availability of other key data, each of which help
        provide confidence in having the best matching business based on your
        search input.</p><br>
        <p><strong>SBCS Consortium Members</strong> can use the Businesses API /search endpoint.</p>
        <p><strong>SBFE Consortium Members</strong> must use the <a href="/products/us/businesses/small-business-financial-exchangetm">SBFE MultiSegments API</a>, using either the 
        List of Similars product option to search for a business, or a Name/Address request for automated matching.</p> 
        <br>
        <p><b>Product Request</b></p><br><p>In order to
        request business data for most of Experian's Business Information APIs,
        the Business Identification Number (BIN) must be provided on the
        request.  You can search for a BIN by providing the following
        information:</p> <ul> <li>Business Name, City and State - Required</li>
        <li>Street Address, Zip Code, Phone and Tax ID - Optional</li>
        <li>Zip Only Search: Search can be performed with only Business Name and Zip Code - City and State are optional in this scenario</li>
        <li>Geo - Optional. Geo set as true will return
        geographic data on the location</li> <li>Comments - Optional. Echos back
        in your response</li> <li>Subcode - Required</li>
      parameters:
        - description: Business Search Request
          in: body
          required: true
          name: body
          schema:
            $ref: '#/definitions/SearchRequest'
        - name: Content-Type
          in: header
          default: application/json
          enum:
            - application/json
          description: Content-Type field is to describe the data contained in the body
          required: true
          type: string
        - name: x-comments
          in: header 
          default: Test comment
          description: An echo back field that will return x-comments in the response header 
          required: false
          type: string  
      produces:
        - application/json
      responses:
        '200':
          description: Business Search Results
          schema:
            $ref: '#/definitions/SearchResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse400'
        '401':
          description: Authorization information is missing or invalid
          schema:
            $ref: '#/definitions/ErrorResponse401'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse404'
        '500':
          description: Subscription Error
          schema:
            $ref: '#/definitions/ErrorResponse500'
        '502':
          description: Server Error
          schema:
            $ref: '#/definitions/ErrorResponse502'
        '503':
          description: Server Error
          schema:
            $ref: '#/definitions/ErrorResponse503'
  /v1/quicksearch:
    post:
      operationId: quicksearch
      summary: Quick Search.  Our secondary search method
      tags:
        - Business Information Services
      security:
        - OauthSecurity:
            - admin
      consumes:
        - application/json
      description: >-
        <p>Experian's proprietary Quick Search API is powered by OneSearch, our advanced search/match technology and offers new ways to search for a business
        within Experian's commercial database.  Quick Search API users can search by:</p>
        <p><ul>
        <li>Business Name</li>
        <li>Address</li>
        <li>Phone Number</li>
        <li>Contact Name</li>
        <li>Business Identification Number (BIN)</li>
        </ul></p>
        <p>Quick Search contains millions of active businesses and the most inquiried upon businesses in Experian's database.  If you don't find a result
        using Quick Search, please don't stop there.  Use Experian's Advanced Search to perform a more extensive search of Experian's database.</p>
        <p>Search Automation.  For users looking to automate their search/match workflow, it is recommend to use our Advanced Search and our Match Reliability Code.  
        The Quick Search API does not provide a Match Reliability Code; it uses a more flexible search algorithm primarily targeted to 
        human users as a type-ahead search.</p>
        <p>Billing and Caching.  Experian does not perform any caching of Quick Search results at this time.  Every Quick Search API 
        call invokes the latest data available in our database and results in a billing log entry.  We highly recommend implementing 
        caching to prevent duplicate searches from being billed.</p>
      parameters:
        - description: QuickSearch Request
          in: body
          required: true
          name: body
          schema:
            $ref: '#/definitions/QuickSearchRequest'
        - name: Content-Type
          in: header
          default: application/json
          enum:
            - application/json
          description: Content-Type field is to describe the data contained in the body
          required: true
          type: string
        - name: x-comments
          in: header 
          default: Test comment
          description: An echo back field that will return x-comments in the response header 
          required: false
          type: string    
      produces:
        - application/json
      responses:
        '200':
          description: IST Watch Results
          schema:
            $ref: '#/definitions/QuickSearchResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse400'
        '401':
          description: Authorization information is missing or invalid
          schema:
            $ref: '#/definitions/ErrorResponse401'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse404'
        '500':
          description: Subscription Error
          schema:
            $ref: '#/definitions/ErrorResponse500'
        '502':
          description: Server Error
          schema:
            $ref: '#/definitions/ErrorResponse502'
        '503':
          description: Server Error
          schema:
            $ref: '#/definitions/ErrorResponse503'            
