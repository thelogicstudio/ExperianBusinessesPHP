          schema:
            $ref: '#/definitions/ErrorResponse503'
  /v1/scores:
    post:
      operationId: scores
      summary: Commercial Scores
      tags:
        - Business Information Services
      security:
        - OauthSecurity:
            - admin
      consumes:
        - application/json
      description: >-
        <p>The Commercial Scores API allows you to request Experian's Intelliscore Plus Score, 
        Financial Stability Risk Score, or Commercial Recovery Score, or any combination thereof.
        </p>
        <p>Sample subcodes for Intelliscore Plus version 3</p>
        <ul>
        <li>IPv3 Logistic Regression - 0586286</li>
        <li>IPv3 Machine Learning - 0586548</li>
        </ul>
        <p>Sample subcode for Commercial Recovery Score (Collections Score)</p>
        <ul>
        <li>Commercial Recovery Score Logistic Regression (Model 243) - 0517614</li>
        <li>Commercial Recovery Score Machine Learning (Model 245) - 0517614</li>
        </ul>
        <p>&nbsp;</p>
      parameters:
        - description: Commercial Scores Request
          in: body
          required: true
          name: body
          schema:
            $ref: '#/definitions/BusinessScoresRequest'
        - name: Content-Type
          in: header
          default: application/json
          enum:
            - application/json
          description: Content-Type field is to describe the data contained in the body
          required: true
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: Commercial Scores Results
          schema:
            $ref: '#/definitions/ScoresResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse400'
        '401':
          description: Authorization information is missing or invalid
          schema:
            $ref: '#/definitions/ErrorResponse401'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse404'
        '500':
          description: Subscription Error
          schema:
            $ref: '#/definitions/ErrorResponse500'
        '502':
          description: Server Error
          schema:
            $ref: '#/definitions/ErrorResponse502'
        '503':
          description: Server Error
          schema:
            $ref: '#/definitions/ErrorResponse503'
  /v1/scores/search:
    post:
      operationId: scoressearch
      summary: Scores Auto Search
      tags:
        - Business Information Services
      security:
        - OauthSecurity:
            - admin
      consumes:
        - application/json
      description: >-
        <p>The Scores Auto Search API provides our Scores API response, but
        with  a Business Name and Address request input. The Commercial Scores API allows you to request Experian's Intelliscore Plus Score, 
        Financial Stability Risk Score, or Commercial Recovery Score, or any combination thereof.</p>
        <p>Scores Auto Search uses the following inputs:</p> 
        <p> 
        <ul>
        <li>Business Name, City and State - Required</li> 
        <li>Street Address, Zip Code, Phone and Tax ID - Optional</li> 
        <li>Match Reliability Code - Optional. The default MRC value is 96, if not specified</li> 
        <li>Geo - Optional. Geo set as true will return geographic data on the location</li>
        <li>Comments - Optional. Echos back in your response.</li>
        <li>Commercial Score - Optional. Controls if you receive commercial score info</li> 
        <li>FSR Score - Optional. Controls if you receive FSR score info</li>
        <li>Colllections Score (object) - Optional.  Controls if you receive the Collections score info</li>
        <li>Subcode - Required</li>
        </ul>
        </p>
        <p>Sample subcodes for Intelliscore Plus version 3</p>
        <ul>
        <li>IPv3 Logistic Regression - 0586286</li>
        <li>IPv3 Machine Learning - 0586548</li>
        </ul>
        <p>Sample subcode for Commercial Recovery Score (Collections Score)</p>
        <ul>
        <li>Commercial Recovery Score Logistic Regression (Model 243) - 0517614</li>
        <li>Commercial Recovery Score Machine Learning (Model 245) - 0517614</li>
        </ul>
        <p>&nbsp;</p>
      parameters:
        - description: Commercial Scores Request
          in: body
          required: true
